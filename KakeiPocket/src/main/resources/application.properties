spring.application.name=KakeiPocket
# H2 Database
spring.datasource.url=jdbc:h2:file:./data/kakeipocket
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tự động quote các reserved keyword của SQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini / Google AI Studio
gemini.api-key=AQ.Ab8RN6LRaY6DuDG51rDXhS-0Pi9QYtNvNCR6DbJTcPiAcr6l4g
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:25}